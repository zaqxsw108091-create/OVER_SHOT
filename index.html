<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OVERSHOT — 1인칭 슈터</title>
<link rel="stylesheet" href="styles.css?v=20261109b">
</head>
<body>
<div id="app">

  <!-- 로그인 -->
  <section id="login" class="screen active">
    <div class="bg-grid"></div>
    <div class="logo">OVERSHOT<small>1인칭 슈터 · SOLO vs AI</small></div>
    <div class="login-card">
      <label>플레이어 아이디</label>
      <input id="idInput" maxlength="14" placeholder="아이디를 입력하세요" autocomplete="off">
      <div class="hint">영문/한글/숫자 · 14자 이내</div>
      <button class="btn btn-primary" id="loginBtn">입장하기 ▸</button>
    </div>
  </section>

  <!-- 영웅 선택 -->
  <section id="pick" class="screen">
    <div class="bg-grid"></div>
    <div class="pick-wrap">
      <h2>영웅 선택</h2>
      <div class="greet" id="greet">전장에 어서 오세요</div>
      <div class="heroes" id="heroList"></div>
      <button class="btn btn-primary" id="startBtn" style="max-width:360px;margin:26px auto 0;display:block;opacity:.4;pointer-events:none;">전투 시작 ▸</button>
    </div>
  </section>

  <!-- 게임 -->
  <section id="game" class="screen">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div id="topbar">
        <div class="item"><div class="k">KILLS</div><div class="v" id="killVal">0</div></div>
        <div class="item"><div class="k">남은 적</div><div class="v" id="enemyVal">0</div></div>
        <div class="item"><div class="k">TIME</div><div class="v" id="timeVal">0.0</div></div>
      </div>
      <div class="cross"></div>
      <div id="hitmark">✕</div>
      <div class="panel" id="hpPanel"><div class="lbl">HEALTH</div><div class="val" id="hpVal">100</div></div>
      <div class="panel" id="ammoPanel"><div class="lbl">AMMO</div><div class="val" id="ammoVal">20</div></div>
      <div class="panel" id="abilPanel"><div id="abilName">스킬</div><div id="abilBar"><i></i></div></div>
      <div id="hitflash"></div>
      <div class="toast" id="toast"></div>
      <div class="lockmsg" id="lockmsg">클릭하면 시점 조작 시작 · ESC로 일시정지</div>
      <button id="quitBtn" class="hide">✕ 메뉴로 (Q)</button>
    </div>
  </section>

  <!-- 종료 -->
  <section id="over" class="screen">
    <div class="bg-grid"></div>
    <div class="logo" id="overTitle">결과</div>
    <div id="overStats">
      <div class="b"><div class="k">처치</div><div class="v" id="ovKill" style="color:var(--orange)">0</div></div>
      <div class="b"><div class="k">생존시간</div><div class="v" id="ovTime" style="color:var(--cyan)">0s</div></div>
    </div>
    <div id="ovNew" class="hide">★ 신기록!</div>
    <div id="ovBest">최고 기록 · 처치 0 · 생존 0s</div>
    <div id="overBtns">
      <button class="btn btn-primary" id="againBtn">다시 하기 ▸</button>
      <button class="btn btn-ghost" id="menuBtn">메인 메뉴</button>
    </div>
  </section>

</div>
<script src="kage3d.js?v=20261109h"></script>
<script src="titan3d.js?v=20261110a"></script>
<script src="game.js?v=20261110a"></script>
</body>
</html>
